name: NPM release

on:
  release:
    types: [created]
  workflow_dispatch:

# runs for the same tag wait for each other, so a duplicate run sees the
# version the first one published instead of racing it
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          registry-url: "https://registry.npmjs.org"
      - name: Set tag
        run: |
          VER="${GITHUB_REF#refs/*/}"
          if [[ "$VER" == *-* ]]; then
            echo "NPM_TAG=next" >> $GITHUB_ENV
          else
            echo "NPM_TAG=latest" >> $GITHUB_ENV
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
      - run: npm ci
      - name: Sources parse
        run: |
          node --check bench.js
          for f in workloads/*.js; do node --check "$f"; done
      - name: Tag matches package.json
        run: |
          VER="${GITHUB_REF#refs/*/}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then echo "tag $VER != package.json $PKG"; exit 1; fi
      - name: Versions agree (deno.json, package.json)
        run: npx -y @aricart/mrvm@0.1.2 check
      - name: Publish JSR
        run: deno publish
      - name: Publish NPM
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$ver" version 2>/dev/null)" ]; then
            echo "$name@$ver is already on npm, skipping"
            exit 0
          fi
          set +e
          out=$(npm publish --provenance --access public --tag="${NPM_TAG}" 2>&1)
          status=$?
          set -e
          echo "$out"
          # E409: another run published (or staged) this version first
          if [ $status -ne 0 ] && echo "$out" | grep -q "E409"; then
            echo "$name@$ver was published by another run, nothing to do"
            exit 0
          fi
          exit $status
